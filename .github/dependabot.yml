# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # npm version updates are owned by CGENovate, which bundles them into a single
    # reviewed PR each cycle. 0 stops duplicate version PRs while leaving the ignore
    # block below alive as the mute source of truth. Security updates still flow.
    open-pull-requests-limit: 0
    pull-request-branch-name:
      separator: '-' # Use hyphens to separate branch name segments
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    ignore:
      # muted 2026-09-18 — @types/node is capped by .nvmrc, not by latest. This repo pins
      # Node 24 (Krypton, the current Active LTS); Node 26 is still Current. Dependabot reads
      # latest and cannot see the cap, so it re-proposed 26 every cycle (PR #21). Types a major
      # ahead of the runtime make tsc check against APIs that do not exist at run time.
      # Un-mute when .nvmrc moves to the next LTS. Dashboard #25
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions' # Check for updates to GitHub Actions every week
    directory: '/'
    pull-request-branch-name:
      separator: '-'
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
