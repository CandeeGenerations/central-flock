<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/central-flock-logo.png" />
    <!-- display:'standalone' is load-bearing: the export helper keys off the
         display-mode media query to pick the iOS share path over a download.
         See docs/adr/0017-export-delivery-and-ios-standalone.md. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flock" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values. iOS 26+
         paints a status-bar scrim over the top of a standalone web app, so the mobile header
         pads itself by the top inset and lets its own background take the scrim. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Central Flock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
